name: Build Cannonball64 full port

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dragonminded/libdragon:trunk

    steps:
      - name: Checkout Cannonball64
        uses: actions/checkout@v4

      - name: Install libdragon SDK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/libdragon
          git clone --depth 1 --branch trunk \
            https://github.com/DragonMinded/libdragon.git \
            /tmp/libdragon

          make -C /tmp/libdragon -j2 install
          make -C /tmp/libdragon -j2 tools-install

          test -f "$N64_INST/include/n64.mk"
          test -x "$N64_INST/bin/n64tool"
          test -x "$N64_INST/bin/mkdfs"

      - name: Fetch Cannonball core
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_core.sh
          ./scripts/fetch_core.sh
          git -C vendor/cannonball rev-parse HEAD \
            | tee cannonball-upstream-commit.txt

      - name: Prepare public DragonFS placeholders
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/make_placeholder_fs.py

          mkdir -p filesystem/cannonball/res
          if [ -d vendor/cannonball/res ]; then
            cp -a vendor/cannonball/res/. filesystem/cannonball/res/
          fi

          find filesystem -type f -empty -delete
          find filesystem -depth -type d -empty -delete

      - name: Build N64 ROM
        shell: bash
        run: |
          set -euxo pipefail
          make -j2

      - name: Verify public ROM layout
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/verify_public_rom.py cannonball64-r2.z64

      - name: Package build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp cannonball64-r2.z64 package/
          cp cannonball-upstream-commit.txt package/
          cp ROM_REQUIREMENTS.txt package/
          cp scripts/check_roms.py package/
          cp scripts/pack_local_roms.sh package/
          cp README.md package/

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: cannonball64-r2-full-port
          path: package/
